<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hochzeitseinladung – Saskia & Tim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Cinzel:wght@400;500&family=IM+Fell+English:ital@1&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #1a1f2e;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Cormorant Garamond', serif;
  }

  /* DIN A6 = 105mm × 148mm → bei 96dpi ≈ 396px × 559px */
  .card {
    width: 396px;
    height: 559px;
    position: relative;
    overflow: hidden;
    background: #f4f0ea;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
  }

  /* Tiefblauer Himmel-Gradient */
  .bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      180deg,
      #0d1b2a 0%,
      #162032 35%,
      #1e3a5f 60%,
      #2d5a8e 80%,
      #3a6fa0 100%
    );
  }

  /* Sterne */
  .stars {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; }
    50% { opacity: var(--max-op, 0.9); }
  }

  /* Mondschein-Glühen oben rechts */
  .moon {
    position: absolute;
    top: -30px;
    right: -30px;
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #fff9e6, #f0d080 40%, #c8a020 70%, transparent 100%);
    box-shadow:
      0 0 40px 20px rgba(240,200,80,0.25),
      0 0 80px 40px rgba(200,160,30,0.12);
    animation: moonGlow 6s ease-in-out infinite;
  }
  @keyframes moonGlow {
    0%, 100% { box-shadow: 0 0 40px 20px rgba(240,200,80,0.25), 0 0 80px 40px rgba(200,160,30,0.12); }
    50% { box-shadow: 0 0 60px 30px rgba(240,200,80,0.38), 0 0 110px 55px rgba(200,160,30,0.18); }
  }

  /* Schneeflocken-Animation */
  .snowflakes {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .flake {
    position: absolute;
    top: -20px;
    color: rgba(255,255,255,0.85);
    font-size: var(--size, 14px);
    animation: fall var(--fall-dur, 6s) linear infinite var(--fall-delay, 0s);
    user-select: none;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) translateX(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: 1; }
    90%  { opacity: 0.7; }
    100% { transform: translateY(580px) translateX(var(--drift,20px)) rotate(360deg); opacity: 0; }
  }

  /* Tannenwald-Silhouette unten */
  .forest {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 200px;
  }

  /* Schneedecke */
  .snow-ground {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 38px;
    background: linear-gradient(180deg, #e8f0f8 0%, #ffffff 100%);
    border-radius: 50% 50% 0 0 / 20px 20px 0 0;
    box-shadow: 0 -4px 20px rgba(200,220,255,0.4);
  }

  /* Schmuckrahmen */
  .frame-outer {
    position: absolute;
    inset: 12px;
    border: 1px solid rgba(255,255,255,0.18);
    pointer-events: none;
  }
  .frame-inner {
    position: absolute;
    inset: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }

  /* Eckornamente */
  .corner {
    position: absolute;
    width: 26px;
    height: 26px;
    opacity: 0.6;
  }
  .corner svg { width: 100%; height: 100%; }
  .corner.tl { top: 10px; left: 10px; }
  .corner.tr { top: 10px; right: 10px; transform: scaleX(-1); }
  .corner.bl { bottom: 10px; left: 10px; transform: scaleY(-1); }
  .corner.br { bottom: 10px; right: 10px; transform: scale(-1,-1); }

  /* Textcontainer */
  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 28px 30px 60px;
    text-align: center;
    color: #fff;
  }

  .label-top {
    font-family: 'Cinzel', serif;
    font-size: 9.5px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: rgba(240,215,120,0.85);
    margin-bottom: 14px;
    animation: fadeDown 1.2s ease both 0.3s;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    animation: fadeDown 1.2s ease both 0.5s;
  }
  .divider-line {
    width: 50px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(240,215,120,0.7));
  }
  .divider-line.right {
    background: linear-gradient(90deg, rgba(240,215,120,0.7), transparent);
  }
  .divider-icon {
    color: rgba(240,215,120,0.85);
    font-size: 13px;
  }

  .names {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 44px;
    line-height: 1.0;
    letter-spacing: 1px;
    color: #ffffff;
    text-shadow: 0 0 40px rgba(200,230,255,0.4), 0 2px 8px rgba(0,0,0,0.5);
    animation: fadeDown 1.2s ease both 0.7s;
  }
  .names .amp {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 32px;
    color: rgba(240,215,120,0.9);
    display: block;
    margin: 2px 0;
  }

  .divider2 {
    margin: 12px 0 12px;
    animation: fadeDown 1.2s ease both 0.9s;
  }

  .invitation-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13.5px;
    color: rgba(255,255,255,0.75);
    letter-spacing: 0.5px;
    line-height: 1.6;
    margin-bottom: 16px;
    animation: fadeDown 1.2s ease both 1.1s;
  }

  .date-block {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(240,215,120,0.3);
    border-radius: 2px;
    padding: 12px 28px;
    animation: fadeDown 1.2s ease both 1.3s;
    backdrop-filter: blur(4px);
    margin-bottom: 14px;
  }
  .date-day {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(240,215,120,0.7);
    margin-bottom: 4px;
  }
  .date-main {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 23px;
    letter-spacing: 2px;
    color: #ffffff;
  }

  .location-hint {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 1px;
    margin-bottom: 16px;
    animation: fadeDown 1.2s ease both 1.5s;
  }

  .rsvp-note {
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: rgba(240,215,120,0.45);
    animation: fadeDown 1.2s ease both 1.7s;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Schneekristall-Dekor */
  .snowcrystal {
    position: absolute;
    opacity: 0.08;
    pointer-events: none;
  }
  .snowcrystal.left  { bottom: 55px; left: -10px; width: 90px; }
  .snowcrystal.right { bottom: 55px; right: -10px; width: 90px; transform: scaleX(-1); }
</style>
</head>
<body>

<div class="card">
  <div class="bg"></div>

  <!-- Mond -->
  <div class="moon"></div>

  <!-- Sterne -->
  <div class="stars" id="stars"></div>

  <!-- Schneeflocken -->
  <div class="snowflakes" id="flakes"></div>

  <!-- Tannenwald SVG -->
  <svg class="forest" viewBox="0 0 396 200" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
    <!-- Hintere Schicht (dunkler) -->
    <polygon points="0,200 0,130 15,130 5,110 22,110 10,85 30,85 18,62 40,62 25,38 55,38 40,62 58,62 48,85 62,85 52,108 68,108 58,130 78,130 78,200" fill="#0d2a1a" opacity="0.7"/>
    <polygon points="40,200 40,140 52,140 43,120 58,120 48,96 66,96 55,72 75,72 62,50 90,50 77,72 95,72 84,96 100,96 90,120 105,120 96,140 112,140 112,200" fill="#0e2e1c" opacity="0.7"/>
    <polygon points="340,200 340,130 328,130 338,110 322,110 334,85 314,85 326,62 306,62 320,38 292,38 306,62 288,62 298,85 284,85 294,108 278,108 288,130 268,130 268,200" fill="#0d2a1a" opacity="0.7"/>
    <polygon points="300,200 300,140 288,140 297,120 283,120 292,96 276,96 286,72 268,72 280,50 253,50 266,72 249,72 259,96 244,96 254,120 239,120 249,140 234,140 234,200" fill="#0e2e1c" opacity="0.7"/>
    <!-- Mittlere Schicht -->
    <polygon points="60,200 60,145 74,145 63,122 80,122 68,98 88,98 75,74 98,74 83,50 115,50 100,74 118,74 106,98 124,98 113,122 128,122 119,145 138,145 138,200" fill="#102f1e"/>
    <polygon points="250,200 250,145 238,145 248,122 232,122 244,98 226,98 238,74 218,74 232,50 202,50 216,74 198,74 210,98 194,98 206,122 192,122 182,145 200,145 200,200" fill="#102f1e"/>
    <polygon points="310,200 310,148 323,148 314,128 328,128 318,107 334,107 323,86 342,86 330,65 356,65 343,86 360,86 350,107 364,107 354,128 368,128 359,148 376,148 376,200" fill="#102f1e"/>
    <!-- Vordere Schicht (heller, mit Schnee) -->
    <polygon points="120,200 120,155 132,155 122,134 138,134 127,112 144,112 133,90 153,90 140,68 165,68 153,90 170,90 160,112 175,112 165,134 180,134 172,155 188,155 188,200" fill="#163d26"/>
    <polygon points="196,200 196,155 184,155 193,134 178,134 188,112 173,112 183,90 165,90 177,68 153,68 165,90 148,90 158,112 143,112 153,134 138,134 130,155 147,155 147,200" fill="#163d26"/>
    <polygon points="268,200 268,150 280,150 271,130 285,130 276,110 290,110 280,90 296,90 285,70 308,70 298,90 312,90 302,110 315,110 307,130 319,130 312,150 325,150 325,200" fill="#163d26"/>
    <!-- Schneekappen auf Bäumen -->
    <polygon points="165,68 153,60 140,68" fill="white" opacity="0.9"/>
    <polygon points="115,50 100,42 83,50" fill="white" opacity="0.9"/>
    <polygon points="308,70 285,62 265,70" fill="white" opacity="0.9"/>
    <polygon points="356,65 330,57 310,65" fill="white" opacity="0.8"/>
    <polygon points="40,38 25,30 10,38" fill="white" opacity="0.8"/>
    <!-- Schnee auf Ästen -->
    <polygon points="118,74 106,70 98,74" fill="white" opacity="0.6"/>
    <polygon points="298,90 285,85 270,90" fill="white" opacity="0.6"/>
    <polygon points="180,134 172,130 165,134" fill="white" opacity="0.5"/>
  </svg>

  <!-- Schneedecke -->
  <div class="snow-ground"></div>

  <!-- Schneekristalle links/rechts -->
  <svg class="snowcrystal left" viewBox="0 0 100 100" fill="white" xmlns="http://www.w3.org/2000/svg">
    <line x1="50" y1="5" x2="50" y2="95" stroke="white" stroke-width="2"/>
    <line x1="5" y1="50" x2="95" y2="50" stroke="white" stroke-width="2"/>
    <line x1="19" y1="19" x2="81" y2="81" stroke="white" stroke-width="2"/>
    <line x1="81" y1="19" x2="19" y2="81" stroke="white" stroke-width="2"/>
    <circle cx="50" cy="5" r="3" fill="white"/>
    <circle cx="50" cy="95" r="3" fill="white"/>
    <circle cx="5" cy="50" r="3" fill="white"/>
    <circle cx="95" cy="50" r="3" fill="white"/>
    <circle cx="19" cy="19" r="3" fill="white"/>
    <circle cx="81" cy="19" r="3" fill="white"/>
    <circle cx="81" cy="81" r="3" fill="white"/>
    <circle cx="19" cy="81" r="3" fill="white"/>
    <circle cx="50" cy="50" r="5" fill="white"/>
  </svg>
  <svg class="snowcrystal right" viewBox="0 0 100 100" fill="white" xmlns="http://www.w3.org/2000/svg">
    <line x1="50" y1="5" x2="50" y2="95" stroke="white" stroke-width="2"/>
    <line x1="5" y1="50" x2="95" y2="50" stroke="white" stroke-width="2"/>
    <line x1="19" y1="19" x2="81" y2="81" stroke="white" stroke-width="2"/>
    <line x1="81" y1="19" x2="19" y2="81" stroke="white" stroke-width="2"/>
    <circle cx="50" cy="5" r="3" fill="white"/>
    <circle cx="50" cy="95" r="3" fill="white"/>
    <circle cx="5" cy="50" r="3" fill="white"/>
    <circle cx="95" cy="50" r="3" fill="white"/>
    <circle cx="19" cy="19" r="3" fill="white"/>
    <circle cx="81" cy="19" r="3" fill="white"/>
    <circle cx="81" cy="81" r="3" fill="white"/>
    <circle cx="19" cy="81" r="3" fill="white"/>
    <circle cx="50" cy="50" r="5" fill="white"/>
  </svg>

  <!-- Rahmen -->
  <div class="frame-outer"></div>
  <div class="frame-inner"></div>

  <!-- Eckornamente -->
  <div class="corner tl"><svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 28 L2 2 L28 2" stroke="rgba(240,215,120,0.7)" stroke-width="1.2"/><path d="M2 14 Q8 8 14 2" stroke="rgba(240,215,120,0.4)" stroke-width="0.8" fill="none"/><circle cx="2" cy="2" r="2" fill="rgba(240,215,120,0.7)"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 28 L2 2 L28 2" stroke="rgba(240,215,120,0.7)" stroke-width="1.2"/><path d="M2 14 Q8 8 14 2" stroke="rgba(240,215,120,0.4)" stroke-width="0.8" fill="none"/><circle cx="2" cy="2" r="2" fill="rgba(240,215,120,0.7)"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 28 L2 2 L28 2" stroke="rgba(240,215,120,0.7)" stroke-width="1.2"/><path d="M2 14 Q8 8 14 2" stroke="rgba(240,215,120,0.4)" stroke-width="0.8" fill="none"/><circle cx="2" cy="2" r="2" fill="rgba(240,215,120,0.7)"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 28 L2 2 L28 2" stroke="rgba(240,215,120,0.7)" stroke-width="1.2"/><path d="M2 14 Q8 8 14 2" stroke="rgba(240,215,120,0.4)" stroke-width="0.8" fill="none"/><circle cx="2" cy="2" r="2" fill="rgba(240,215,120,0.7)"/></svg></div>

  <!-- Text -->
  <div class="content">
    <div class="label-top">Save the Date</div>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-icon">❄</span>
      <div class="divider-line right"></div>
    </div>

    <div class="names">
      Saskia
      <span class="amp">&amp;</span>
      Tim
    </div>

    <div class="divider2">
      <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-icon" style="font-size:10px;">✦</span>
        <div class="divider-line right"></div>
      </div>
    </div>

    <div class="invitation-text">
      Haltet euch diesen Tag frei –<br>
      wir heiraten!
    </div>

    <div class="date-block">
      <div class="date-day">Samstag</div>
      <div class="date-main">28. November 2026</div>
    </div>

    <div class="rsvp-note">
      Offizielle Einladung folgt
    </div>
  </div>
</div>

<script>
  // Sterne generieren
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 55; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2 + 0.8;
    s.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*65}%;
      --dur:${2+Math.random()*4}s;
      --delay:${Math.random()*5}s;
      --max-op:${0.4+Math.random()*0.6};
    `;
    starsEl.appendChild(s);
  }

  // Schneeflocken
  const flakesEl = document.getElementById('flakes');
  const symbols = ['❄', '❅', '❆', '·', '•'];
  for (let i = 0; i < 22; i++) {
    const f = document.createElement('div');
    f.className = 'flake';
    f.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    f.style.cssText = `
      left:${Math.random()*100}%;
      --size:${10+Math.random()*10}px;
      --fall-dur:${5+Math.random()*7}s;
      --fall-delay:${Math.random()*8}s;
      --drift:${-30+Math.random()*60}px;
    `;
    flakesEl.appendChild(f);
  }
</script>
</body>
</html>
